<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kesavaraj K — Electrical & Embedded Systems Engineer. Portfolio of projects in power electronics, reinforcement learning, embedded systems, and full-stack development."
    />
    <meta name="theme-color" content="#000000" />
    <title>Kesavaraj K | Electrical & Embedded Systems Engineer</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = stored || (prefersLight ? 'light' : 'dark');
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
